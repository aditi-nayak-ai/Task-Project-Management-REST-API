name: CI/CD
 
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
 
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - run: pip install ruff
      - run: ruff check app tests
 
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Run test suite
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-test-secret-key-at-least-32-characters-long"
          RUN_MIGRATIONS_ON_STARTUP: "false"
        run: pytest --cov=app --cov-report=term-missing
 
  migrations:
    # Runs the real Alembic migrations on a fresh Postgres. The pytest job
    # builds its schema with create_all() on SQLite, so it can never notice a
    # missing or broken migration; this job can.
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskdb
      SECRET_KEY: "ci-test-secret-key-at-least-32-characters-long"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Upgrade a fresh database to head
        run: alembic upgrade head
      - name: Fail if models and migrations have drifted apart
        # Catches a model/table with no migration (the missing refresh_tokens bug).
        run: alembic check
      - name: Downgrade to base and upgrade again
        run: |
          alembic downgrade base
          alembic upgrade head
 
  build-and-push:
    runs-on: ubuntu-latest
    needs: [test, migrations]
    # Only build/push a real image once tests pass on main; PRs stop after `test`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
 
      - name: Set image name (lowercase)
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
 
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy
        # Create a Deploy Hook in Render (Service -> Settings -> Deploy Hook)
        # and store its URL as the RENDER_DEPLOY_HOOK_URL repo secret.
        # Render will pull the newly pushed image / rebuild and run
        # `alembic upgrade head` via RUN_MIGRATIONS_ON_STARTUP, or via a
        # separate release-phase command if you've since moved to one.
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
